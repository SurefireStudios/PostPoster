name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax-check every PHP file
        run: |
          status=0
          count=0
          while IFS= read -r file; do
            count=$((count + 1))
            if ! output=$(php -l "$file" 2>&1); then
              status=1
              echo "::error file=${file}::${output//$'\n'/ }"
              printf '%s\n' "$output"
            fi
          done < <(find . -name '*.php' -type f -not -path './.git/*' | sort)
          echo "Checked $count PHP file(s) on PHP ${{ matrix.php }}."
          exit $status

      - name: Run the cache invalidation tests
        run: php tests/test-cache.php

  javascript:
    name: javascript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Syntax-check every JS file
        run: |
          status=0
          count=0
          for file in assets/*.js; do
            count=$((count + 1))
            if ! output=$(node --check "$file" 2>&1); then
              status=1
              echo "::error file=${file}::syntax error"
              printf '%s\n' "$output"
            fi
          done
          echo "Checked $count JavaScript file(s)."
          exit $status

      - name: Fail on debug leftovers in shipped code
        run: python3 .github/scripts/check-debug-leftovers.py
